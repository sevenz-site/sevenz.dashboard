<!doctype html>
<!--
  THE «SIN CONEXIÓN» SCREEN (PL-48, step 1.2; frames «Sin conexión · 375» and «· 1280»,
  approved by the owner on 2026-11-20). public/sw.js serves it ONLY when a page
  navigation fails at the network: never instead of a page that loaded, so the service
  worker still cannot show stale code (decision D3, 2026-11-18: a screen, no reading or
  writing without a connection).

  Plain HTML with inline styles on purpose: with no network there is no Next.js, no
  stylesheet and no web font, so everything it needs is in this file. The values are
  the app's tokens written out (foreground #272727, muted #737373, border radius 10px).

  It says nothing about what was saved: if the signal dropped halfway through a sale,
  the app cannot know, and «tranquilo, quedó guardado» would be a promise it cannot keep.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · Sevenz</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #272727;
        font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 32px;
        background: #f5f5f5;
      }
      h1 { font-size: 20px; line-height: 28px; font-weight: 600; }
      p { font-size: 14px; line-height: 20px; color: #737373; }
      button {
        width: 100%;
        height: 40px;
        padding: 8px 16px;
        border: 0;
        border-radius: 10px;
        background: #272727;
        color: #fafafa;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid rgba(39, 39, 39, 0.3); outline-offset: 2px; }
      /* From md (768px) the button takes its natural width, as in the 1280 frame. */
      @media (min-width: 768px) { button { width: auto; } }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
      </div>
      <h1>Sin conexión</h1>
      <p>Revisa tu señal o tus datos móviles y vuelve a intentarlo. Sevenz necesita internet para mostrar y guardar tus cuentas.</p>
      <button type="button" id="retry">Reintentar</button>
    </main>
    <script>
      // The service worker answers the FAILED navigation with this file, under that
      // navigation's own URL, so a reload asks for the page the owner wanted.
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
      // Not in the frame, said out loud: when the phone gets signal back, the page
      // retries by itself, so an owner who put the phone down does not come back to a
      // dead screen. Only once per return of the signal.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
