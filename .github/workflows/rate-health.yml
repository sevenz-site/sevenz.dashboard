# Fails, and so makes GitHub notify the owner, when production has been showing a held
# exchange rate for more than 24 hours — and, since 2026-11-09 (PL-28), when the WhatsApp
# cron has not run for 26 hours or its last run errored (lib/admin/daily-health.ts). See app/api/cron/rate-health/route.ts for why this is
# the channel. Runs after the 13:00 UTC rate cron; GitHub may start it some minutes late.
#
# Needs one repository secret, CRON_SECRET, with the same value Vercel has in production.
# Without it the run fails on purpose: a check that cannot ask must not look healthy.
#
# TWO TIMES A DAY, AND NEVER ON THE HOUR. On 2026-11-06 the first scheduled run never started,
# with the file on main, the cron valid, the workflow active and a manual run working. GitHub
# says a schedule can be delayed or dropped under load, so one time a day was a single point of
# failure. The second time is the same question asked again, and it is free: a healthy rate
# answers 200 and nothing is sent.
#
# Changing these lines also makes GitHub register the schedule again, which is the known way
# out of that failure, and it decides the mailbox: a scheduled run notifies whoever last
# changed the cron lines.
#
# THE ALERT DOES NOT DEPEND ON THIS. `/api/cron/whatsapp`, on Vercel, raises the same alert on a
# different clock: see lib/whatsapp/tasa-retenida.ts. Neither can silence the other.
name: Salud de la tasa

on:
  schedule:
    - cron: "30 14 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Preguntar a produccion
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=Falta CRON_SECRET::El secreto del repositorio no esta puesto."
            exit 1
          fi
          code=$(curl -sS -o body.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://app.sevenz.site/api/cron/rate-health) || code=000
          cat body.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            detail=$(jq -r '.detail // .error // "sin detalle"' body.json 2>/dev/null || echo "sin respuesta")
            echo "::error title=Tasa de Sevenz (HTTP $code)::$detail"
            exit 1
          fi
